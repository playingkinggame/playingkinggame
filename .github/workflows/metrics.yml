# OPTIONAL. Generates a self-hosted stats card from your real GitHub data.
# Requires a repository secret named METRICS_TOKEN (classic PAT, scopes: read:user, repo).
# The README shows a placeholder until this has run once, so nothing breaks if you skip it.
name: Metrics

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ github.repository_owner == 'playingkinggame' }}
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: playingkinggame
          template: classic
          base: header, activity, community, repositories
          config_timezone: Asia/Kolkata
          filename: assets/generated/metrics.svg
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size, percentage
          plugin_languages_threshold: 2%
          commit_message: "chore: update metrics [skip ci]"
