name: Generate contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"   # every 12 hours
  workflow_dispatch:          # manual run from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write             # needed to push the generated SVGs to the `output` branch

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake-dark.svg?color_snake=%2322d3ee&color_dots=%23161b22,%234c1d95,%237c3aed,%23a855f7,%2322d3ee
            dist/github-snake.svg?color_snake=%237c3aed&color_dots=%23ebedf0,%23ddd6fe,%23c4b5fd,%238b5cf6,%236d28d9

      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
